# One-time clean-up for the public 1.00 release: removes the 3.x development releases and their tags,
# and the build runs of commits that are no longer in the history. Runs once, when this file is added;
# it's removed again afterwards.
name: Remove development releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-releases.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the v3.x releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --repo "$REPO" --limit 200 --json tagName --jq '.[].tagName' | grep -E '^v3\.'); do
            echo "Deleting release $tag"
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
          done
          # Tags without a release
          for tag in $(gh api "repos/$REPO/tags?per_page=100" --jq '.[].name' | grep -E '^v3\.'); do
            echo "Deleting tag $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" || true
          done

      - name: Delete build runs of the old history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$REPO/actions/runs?per_page=100" --paginate --jq ".workflow_runs[] | select(.head_sha != \"$GITHUB_SHA\") | .id"); do
            echo "Deleting run $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done
